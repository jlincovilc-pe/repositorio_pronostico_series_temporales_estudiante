name: repository-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PyYAML pytest nbformat
      - run: python -m pytest -q tests/test_documentation.py
      - run: python -m pytest -q tests/test_notebooks.py
